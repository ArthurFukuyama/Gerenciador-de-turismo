{% extends "base.html" %}
{% block title %}Login - Guia Turístico{% endblock %}
{% block content %}
    <h2>Login no Sistema de tourismo</h2>
    {% if erro %}
        <p class="error">{{ erro }}</p>
    {% endif %}
    <form method="POST">
        <p>
            <label>Usuário:</label><br>
            <input type="text" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </p>
        <p>
            <label>Senha:</label><br>
            <input type="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </p>
        <button type="submit" class="btn">Entrar</button>
    </form>
    <p style="margin-top: 15px; font-size: 12px; color: #666;">
        <b>Dicas de teste:</b><br>
        Usuário: <code>admin</code> / Senha: <code>123</code><br>
        Usuário: <code>viajante</code> / Senha: <code>abc</code>
    </p>
{% endblock %}
