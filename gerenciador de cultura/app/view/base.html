<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Guia Turístico{% endblock %}</title>
    <style>
        /* Variáveis de cores para facilitar ajustes */
        :root {
            --fundo: #e6f2ff;         /* Azul claro bem suave para o fundo da página */
            --container-bg: #ffffff;  /* Branco para o cartão central */
            --azul-claro: #87ceeb;    /* Azul claro principal */
            --azul-hover: #5cb85c;    /* Tom para efeito hover */
            --texto-escuro: #111111;  /* Preto/Grafite para leitura clara */
            --texto-brancao: #ffffff; /* Texto claro */
            --erro: #e63946;          /* Cor de alerta/erro */
            --borda: #d0e1f9;         /* Borda azulada sutil */
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--fundo); 
            color: var(--texto-escuro);
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%;
            max-width: 600px; 
            background: var(--container-bg); 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid var(--borda);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); 
        }

        /* Estilização de títulos dentro do container */
        .container h1, .container h2, .container h3 {
            color: var(--texto-escuro);
            border-bottom: 3px solid var(--azul-claro);
            padding-bottom: 8px;
            margin-top: 0;
        }

        /* Botões */
        .btn { 
            display: inline-block;
            background-color: var(--azul-claro); 
            color: var(--texto-escuro); 
            padding: 10px 18px; 
            border: none; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: bold;
            cursor: pointer; 
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn:hover {
            background-color: #5eaad4;
            color: var(--texto-brancao);
        }

        .btn-danger { 
            background-color: #000000; 
            color: var(--texto-brancao);
        }

        .btn-danger:hover {
            background-color: #333333;
        }

        /* Campos de formulários (se houver) */
        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fcfcfc;
            color: var(--texto-escuro);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--azul-claro);
            box-shadow: 0 0 5px rgba(135, 206, 235, 0.8);
        }

        /* Mensagens de erro */
        .error { 
            color: var(--erro); 
            font-size: 14px; 
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
