{% extends "base.html" %}
{% block title %}Cadastro - Guia Turístico{% endblock %}
{% block content %}
    <h2>Cadastrar Nova Pessoa</h2>
    {% if erro %}
        <p class="error">{{ erro }}</p>
    {% endif %}
    <form method="POST">
        <p>
            <label>Nome Completo:</label><br>
            <input type="text" name="nome" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </p>
        <p>
            <label>Usuário (login):</label><br>
            <input type="text" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </p>
        <p>
            <label>Senha:</label><br>
            <input type="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </p>
        <button type="submit" class="btn">Cadastrar</button>
    </form>
    <p style="margin-top: 20px;">
        Já possui uma conta? <a href="{{ url_for('auth.login') }}">Voltar para o Login</a>
    </p>
{% endblock %}
